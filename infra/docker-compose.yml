# Base stack: Postgres + Redis + the web app (+ optional Cloudflare Tunnel).
# Postgres/Redis are reachable only on the internal Docker network — not the host.
# Run from the repo root (reads ./.env — copy .env.example first):
#   docker compose -f infra/docker-compose.yml up -d
# With the public tunnel (needs CLOUDFLARE_TUNNEL_TOKEN in .env):
#   docker compose -f infra/docker-compose.yml --profile tunnel up -d
# For local dev (mounts the repo, hot reload), add the dev overlay:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodtruck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodtruck}
      POSTGRES_DB: ${POSTGRES_DB:-foodtruck}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port publish — internal network only.
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-foodtruck} -d ${POSTGRES_DB:-foodtruck}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only persistence so pub/sub restarts don't lose durable data.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    # App settings (auth, Square, admin login…) come from the repo's .env;
    # the values below override the host-oriented ones for inside Docker.
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://${POSTGRES_USER:-foodtruck}:${POSTGRES_PASSWORD:-foodtruck}@postgres:5432/${POSTGRES_DB:-foodtruck}
      REDIS_URL: redis://redis:6379
      # Empty → Auth.js uses the request's own host (trustHost), so login works
      # from localhost, the truck LAN IP, and the tunnel hostname alike.
      AUTH_URL: ''
    # Host port is configurable — another local project may already hold 3000.
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Cloudflare Tunnel — exposes the app publicly so Square can reach the webhook
  # endpoint. Remotely-managed (token) tunnel: the public hostname → service
  # mapping (route your hostname to http://web:3000) is configured in the
  # Cloudflare Zero Trust dashboard. Outbound-only; no ports published.
  # Opt-in: only starts with `--profile tunnel` (it crash-loops without a token).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ['tunnel']
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
